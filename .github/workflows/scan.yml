name: Value scanner

# NFL / NBA / college basketball / NHL game lines vs the sharp market (scan/scan.py).
#   watch -- long-running loop, 9 AM (weekends 7 AM) to midnight ET: free Novig / Kalshi / Polymarket checks every 3 minutes,
#            paid Odds API pulls (~3 credits for a whole sport) only on triggers; hard monthly credit cap.
#            Started hourly; the concurrency group queues the next start behind the running loop, so a late
#            GitHub schedule never leaves a gap and two loops never run at once.
#   grade -- 7:05, 8:35 and 9:35 AM ET (GitHub's schedule can skip; the morning report posts once) and at the end of every watch run: finals from ESPN (free), win/loss, profit, closing-line value.
# Prices go to Firestore (scan_plays) and Discord only -- this repo is public, the log prints counts.
on:
  schedule:
    - cron: '0 14-23,0-3 * * *'
    - cron: '0 12-13 * * 0,6'   # Sat/Sun from 7 AM ET (early EPL kickoffs)
    - cron: '5 12 * * *'
    - cron: '35 13 * * *'
    - cron: '35 14 * * *'
  workflow_dispatch:
    inputs:
      mode: {description: "watch, pull, grade or books (book scorecard)", required: true, default: "watch", type: choice, options: [watch, pull, grade, books, cbbbooks, taken, cfbrecord, timing, day, altprobe, fields, pxprobe, mybooks]}
      minutes: {description: "watch: minutes to run (blank = until midnight ET, max 330)", required: false, default: ""}
      sports: {description: "comma-separated (blank = all)", required: false, default: ""}
      post: {description: "Post alerts to Discord", type: boolean, default: true}

concurrency:
  group: scan-${{ (inputs.mode == 'grade' || inputs.mode == 'books' || inputs.mode == 'cbbbooks' || inputs.mode == 'taken' || inputs.mode == 'cfbrecord' || inputs.mode == 'timing' || inputs.mode == 'day' || inputs.mode == 'altprobe' || inputs.mode == 'fields' || inputs.mode == 'pxprobe' || inputs.mode == 'mybooks' || (github.event.schedule == '5 12 * * *' || github.event.schedule == '35 13 * * *' || github.event.schedule == '35 14 * * *')) && 'grade' || 'watch' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # a finished watch loop starts the next one (GitHub's hourly schedule mostly doesn't fire)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests google-auth websocket-client
      - name: Run
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCAN_DISCORD_WEBHOOK_URL: ${{ secrets.SCAN_DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
          SCAN_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.post || 'true' }}
          SCAN_SPORTS: ${{ inputs.sports }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in "5 12 * * *"|"35 13 * * *"|"35 14 * * *") MODE=grade ;; *) MODE=watch ;; esac
          fi
          if [ "$MODE" = watch ]; then
            MIN="${{ inputs.minutes }}"
            if [ -z "$MIN" ]; then
              # until 05:00 UTC (midnight ET in winter), at most 330 minutes
              NOW=$(date -u +%s); END=$(date -u -d "$(date -u +%Y-%m-%d) 05:00" +%s)
              [ "$END" -le "$NOW" ] && END=$((END + 86400))
              MIN=$(( (END - NOW) / 60 )); [ "$MIN" -gt 330 ] && MIN=330
              H=$(date -u +%-H); DOW=$(date -u +%u)   # weekends start at 12 UTC (7 AM ET), weekdays at 14 UTC
              START=14; [ "$DOW" -ge 6 ] && START=12
              if [ "$H" -ge 5 ] && [ "$H" -lt "$START" ]; then
                # overnight: wait (free on a public repo) until the morning start, at most 5.5h, then hand off
                WAKE=$(date -u -d "$(date -u +%Y-%m-%d) $START:00" +%s); WAIT=$(( WAKE - NOW )); [ "$WAIT" -gt 19800 ] && WAIT=19800
                echo "overnight -- waiting $((WAIT / 60)) minutes"; sleep "$WAIT"; exit 0
              fi
              python3 scan/scan.py grade || true   # finals + the morning report (posts once, mornings only)
            fi
            echo "watching for $MIN minutes"
            python3 scan/scan.py watch --minutes "$MIN"
          else
            python3 scan/scan.py $MODE
          fi
      - name: Start the next watch loop
        if: ${{ !cancelled() && (inputs.mode == 'watch' || (github.event_name == 'schedule' && github.event.schedule != '5 12 * * *' && github.event.schedule != '35 13 * * *' && github.event.schedule != '35 14 * * *')) && (inputs.minutes == '' || inputs.minutes == null) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml --repo "${{ github.repository }}" --ref master -f mode=watch
