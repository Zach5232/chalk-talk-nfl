name: TD odds history (one-off, td-history branch)
on:
  push:
    branches: [td-history]
    paths: [research/td/td_history.py, .github/workflows/td-history.yml]
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: pip install pandas requests
      - name: Buy historical anytime-TD odds (budget 1700, floor 200)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BUDGET: "1700"
          FLOOR: "200"
        run: python3 research/td/td_history.py
      - name: Commit
        if: always()
        run: |
          git config user.name "td-bot"; git config user.email "td-bot@users.noreply.github.com"
          git add research/td/odds && git commit -qm "TD odds history" && git push origin HEAD:td-history || echo "nothing to commit"
