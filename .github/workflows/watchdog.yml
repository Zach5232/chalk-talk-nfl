name: Scanner watchdog

# Every 15 minutes: is the value scanner alive? (its heartbeat in Firestore, written every few minutes).
# Down during active hours (7 AM weekends / 9 AM weekdays to midnight ET) -> one alert in #value-plays and a restart.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: scanner-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # to start the scanner again

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests google-auth
      - name: Check heartbeat
        id: hb
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCAN_DISCORD_WEBHOOK_URL: ${{ secrets.SCAN_DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SCAN_POST: 'true'
        run: |
          set +e
          python3 scan/scan.py watchdog
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Restart the scanner
        if: steps.hb.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a run that's "in progress" but not checking (hung, or sleeping before a retry) is cancelled first
          for id in $(gh run list --repo "${{ github.repository }}" --workflow scan.yml --status in_progress --json databaseId -q '.[].databaseId'); do
            gh run cancel "$id" --repo "${{ github.repository }}" || true
          done
          sleep 20
          gh workflow run scan.yml --repo "${{ github.repository }}" --ref master -f mode=watch
