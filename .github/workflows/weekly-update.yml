name: Chalk Talk Weekly Update

# Two ways this runs:
#   1. Scheduled (cron) -- WEEK is auto-detected every run from the real schedule (whichever
#      week still has an unplayed game -- see _detect_current_week() in weekly_update.py), so
#      this needs zero manual maintenance as the season progresses; nothing to bump by hand.
#   2. Manual ("Run workflow" button, top right of this workflow in the Actions tab) -- leave
#      season/week blank for an on-demand odds/results refresh of whatever week it really is
#      right now, or set week explicitly to re-run/fix an old week.
on:
  schedule:
    # Tuesday 10:00 ET (14:00 UTC during EDT, 15:00 UTC during EST -- 14:00 UTC covers the
    # real season, which runs entirely within EDT/EST's daylight-saving window this year).
    - cron: "0 14 * * 2"
    # Sunday 10:45 ET (EDT; 9:45 once standard time starts Nov 1) -- fresh spreads + game totals for
    # game-day line shopping, after most injury news and with game-day weather. ~4 credits. Keeps the
    # team totals/props saved from the last run.
    - cron: "45 14 * * 0"
  workflow_dispatch:
    inputs:
      season:
        description: "Season (leave blank to use the file's default)"
        required: false
        type: string
      week:
        description: "Week (leave blank to use the file's default)"
        required: false
        type: string
      pull_spreads:
        description: "Pull spreads (2 credits: Pinnacle + your 12 books/exchanges)"
        type: boolean
        default: true
      pull_totals:
        description: "Pull game totals / over-unders (2 credits, all games)"
        type: boolean
        default: true
      pull_team_totals:
        description: "Pull team totals (~2 credits per game)"
        type: boolean
        default: true
      team_total_games:
        description: "Team totals only for these teams/games, e.g. BUF,KC (blank = all games)"
        required: false
        type: string
      pull_props:
        description: "Pull player props (~5 credits per game, ~80 a run)"
        type: boolean
        default: false
      full_scan:
        description: "Scan all 13 books (default: full only for games not yet fully scanned, else top 10 = half the credits)"
        type: boolean
        default: false
      post_discord:
        description: "Post updates to Discord (untick for a quiet test run)"
        type: boolean
        default: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Write Firebase service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-key.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Run pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FIREBASE_CREDENTIALS_PATH: /tmp/firebase-key.json
          # Only set when the manual trigger actually filled them in -- an empty string here
          # would override weekly_update.py's real defaults with int("") and crash, so these
          # env vars simply aren't set at all on a blank input (or a cron run).
          CHALKTALK_SEASON: ${{ github.event.inputs.season || '' }}
          CHALKTALK_WEEK: ${{ github.event.inputs.week || '' }}
          # Which odds to pull: the Tuesday cron pulls everything except props (~80 credits a run --
          # tick props on a manual run when you actually want them); the Sunday cron pulls spreads +
          # game totals only; a manual run pulls only what's ticked. Anything not pulled keeps the
          # lines already saved for this week.
          CHALKTALK_ODDS: ${{ github.event_name == 'schedule' && (github.event.schedule == '45 14 * * 0' && 'spreads,totals' || 'spreads,totals,team_totals') || format('{0},{1},{2},{3}', inputs.pull_spreads && 'spreads' || '', inputs.pull_totals && 'totals' || '', inputs.pull_team_totals && 'team_totals' || '', inputs.pull_props && 'props' || '') }}
          CHALKTALK_TT_GAMES: ${{ github.event.inputs.team_total_games || '' }}
          CHALKTALK_FULL_SCAN: ${{ inputs.full_scan || 'false' }}
          DISCORD_WEBHOOK_URL: ${{ (github.event_name == 'schedule' || inputs.post_discord) && secrets.DISCORD_WEBHOOK_URL || '' }}
        run: |
          # An unfilled manual-trigger input arrives here as an empty string, not unset --
          # and int("") in weekly_update.py would crash, so blank ones get unset entirely
          # rather than passed through, falling back to the file's real defaults.
          [ -z "$CHALKTALK_SEASON" ] && unset CHALKTALK_SEASON
          [ -z "$CHALKTALK_WEEK" ] && unset CHALKTALK_WEEK
          python pipeline/weekly_update.py

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/firebase-key.json
# touch to retrigger workflow indexing Tue Sep  8 17:29:53 EDT 2026
