name: Chalk Talk Weekly Update

# Two ways this runs:
#   1. Scheduled (cron) -- WEEK is auto-detected every run from the real schedule (whichever
#      week still has an unplayed game -- see _detect_current_week() in weekly_update.py), so
#      this needs zero manual maintenance as the season progresses; nothing to bump by hand.
#   2. Manual ("Run workflow" button, top right of this workflow in the Actions tab) -- leave
#      season/week blank for an on-demand odds/results refresh of whatever week it really is
#      right now, or set week explicitly to re-run/fix an old week.
on:
  schedule:
    # Tuesday 10:00 ET (14:00 UTC during EDT, 15:00 UTC during EST -- 14:00 UTC covers the
    # real season, which runs entirely within EDT/EST's daylight-saving window this year).
    - cron: "0 14 * * 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season (leave blank to use the file's default)"
        required: false
        type: string
      week:
        description: "Week (leave blank to use the file's default)"
        required: false
        type: string
      pull_spreads:
        description: "Pull spreads (1 credit)"
        type: boolean
        default: true
      pull_team_totals:
        description: "Pull team totals (~1 credit per game)"
        type: boolean
        default: true
      pull_props:
        description: "Pull player props (~5 credits per game, ~80 a run)"
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Write Firebase service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-key.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Run pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FIREBASE_CREDENTIALS_PATH: /tmp/firebase-key.json
          # Only set when the manual trigger actually filled them in -- an empty string here
          # would override weekly_update.py's real defaults with int("") and crash, so these
          # env vars simply aren't set at all on a blank input (or a cron run).
          CHALKTALK_SEASON: ${{ github.event.inputs.season || '' }}
          CHALKTALK_WEEK: ${{ github.event.inputs.week || '' }}
          # Which odds to pull: a cron run pulls everything; a manual run pulls only what's ticked.
          # Anything unticked keeps the lines already saved for this week.
          CHALKTALK_ODDS: ${{ github.event_name != 'workflow_dispatch' && 'spreads,team_totals,props' || format('{0},{1},{2}', inputs.pull_spreads && 'spreads' || '', inputs.pull_team_totals && 'team_totals' || '', inputs.pull_props && 'props' || '') }}
        run: |
          # An unfilled manual-trigger input arrives here as an empty string, not unset --
          # and int("") in weekly_update.py would crash, so blank ones get unset entirely
          # rather than passed through, falling back to the file's real defaults.
          [ -z "$CHALKTALK_SEASON" ] && unset CHALKTALK_SEASON
          [ -z "$CHALKTALK_WEEK" ] && unset CHALKTALK_WEEK
          python pipeline/weekly_update.py

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/firebase-key.json
